name: ci

on:
  push:
  pull_request:

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        target: [claude, antigravity, codex, deepseek-harness]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Locked upstream commit
        id: lock
        run: python -c "import json; print('commit=' + json.load(open('build/upstream.lock'))['commit'])" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: pancerZH/MindSlice
          ref: ${{ steps.lock.outputs.commit }}
          path: .upstream
          fetch-depth: 0
      - name: Generated plugins are up to date
        run: python build/build.py --check --upstream .upstream
      - name: Tests
        env:
          MINDSLICE_UPSTREAM: .upstream
          MINDSLICE_PLUGIN_TARGET: ${{ matrix.target }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -t tests -v
